
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyberpunk Homepage</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            background: #050505;
        }

        /* Background video */

        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.25);
            z-index: -1;
            pointer-events: none;
        }

        /* Main content */

        .info {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 200px;
            padding: 0 15px;
        }

        /* Clock */

        .time {
            color: #ffef00;
            font-size: 40px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(255, 239, 0, 0.5);
        }

        .time h1 {
            border: 2px solid #5ed7f2;
            padding: 10px 20px;
            border-radius: 8px;
            letter-spacing: 3px;
        }

        .date {
            color: #5ed7f2;
            font-size: 15px;
            margin-top: 12px;
            text-shadow: 0 0 10px rgba(94, 215, 242, 0.5);
        }

        /* App shortcuts */

        .flex-apps_container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 35px;
        }

        .flex-apps {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            border-radius: 12px;
            background: transparent;
            transition: background-color 0.3s ease,
                        transform 0.3s ease;
        }

        .flex-apps:hover {
            background-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
        }

        .flex-apps a {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .flex-apps img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            border-radius: 10px;
            transition: transform 0.3s ease;
        }

        .flex-apps:hover img {
            transform: scale(1.1);
        }

        .flex-apps_name {
            text-align: center;
            font-size: 12px;
            font-weight: 500;
            padding-top: 10px;
            color: #5ed7f2;
        }

        /* Cyberpunk logo */

        .cyberpunk {
            position: fixed;
            bottom: 0;
            left: 0;
        }

        .cyberpunk img {
            width: 385px;
            max-width: 80vw;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cyberpunk img:hover {
            transform: scale(1.08);
            transform-origin: bottom left;
        }

        /* Large screens */

        @media screen and (min-height: 722px) {
            .info {
                margin-top: 250px;
            }

            .cyberpunk img {
                width: 500px;
            }
        }

        /* Mobile */

        @media screen and (max-width: 600px) {
            .info {
                margin-top: 100px;
            }

            .time {
                font-size: 25px;
            }

            .time h1 {
                padding: 8px 15px;
            }

            .date {
                font-size: 11px;
            }

            .flex-apps_container {
                gap: 8px;
                margin-top: 35px;
                max-width: 350px;
            }

            .flex-apps {
                padding: 8px;
            }

            .flex-apps img {
                width: 45px;
                height: 45px;
            }

            .flex-apps_name {
                font-size: 9px;
            }

            .cyberpunk {
                left: 50%;
                transform: translateX(-50%);
            }

            .cyberpunk img {
                width: 250px;
                max-width: 85vw;
            }

            .cyberpunk img:hover {
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <!-- Background video -->

    <video autoplay muted loop playsinline class="background-video">
        <source src="background video/753fbb06-d139-44a8-a8a9-a68bb12cb819.mp4"
            type="video/mp4">
    </video>

    <main class="info">

        <!-- Clock -->

        <div class="time">
            <h1 id="time">00:00 AM</h1>
        </div>

        <div class="date">
            <h3 id="date">Loading date...</h3>
        </div>

        <!-- App shortcuts -->

        <div class="flex-apps_container">

            <div class="flex-apps">
                <a href="https://mail.google.com/mail/u/0/"
                    aria-label="Gmail">
                    <img src="https://leetcodr.github.io/homepage/images/2.png"
                        alt="Gmail">
                </a>
                <h2 class="flex-apps_name">Gmail</h2>
            </div>

            <div class="flex-apps">
                <a href="https://www.youtube.com/"
                    aria-label="YouTube">
                    <img src="https://leetcodr.github.io/homepage/images/8.png"
                        alt="YouTube">
                </a>
                <h2 class="flex-apps_name">YouTube</h2>
            </div>

            <div class="flex-apps">
                <a href="https://github.com/"
                    aria-label="GitHub">
                    <img src="https://leetcodr.github.io/homepage/images/9.png"
                        alt="GitHub">
                </a>
                <h2 class="flex-apps_name">GitHub</h2>
            </div>

            <div class="flex-apps">
                <a href="https://google.com/"
                    aria-label="Google">
                    <img src="https://www.pngmart.com/files/22/Google-PNG-File.png"
                        alt="Google">
                </a>
                <h2 class="flex-apps_name">Google</h2>
            </div>

            <div class="flex-apps">
                <a href="https://www.linkedin.com/feed/"
                    aria-label="LinkedIn">
                    <img style="background-color: white;"
                        src="https://png.pngtree.com/png-clipart/20190613/original/pngtree-linked-in-icon-png-image_3584840.jpg"
                        alt="LinkedIn">
                </a>
                <h2 class="flex-apps_name">LinkedIn</h2>
            </div>

            <!-- LeetCode -->

            <div class="flex-apps">
                <a href="https://leetcode.com/"
                    aria-label="LeetCode">
                    <img src="https://leetcode.com/static/images/LeetCode_logo.png"
                        alt="LeetCode">
                </a>
                <h2 class="flex-apps_name">LeetCode</h2>
            </div>

            <div class="flex-apps">
                <a href="https://chatgpt.com/"
                    aria-label="ChatGPT">
                    <img src="https://leetcodr.github.io/homepage/images/10.png"
                        alt="ChatGPT">
                </a>
                <h2 class="flex-apps_name">ChatGPT</h2>
            </div>

        </div>

    </main>

    <!-- Cyberpunk logo -->

    <div class="cyberpunk">
        <img src="https://purepng.com/public/uploads/large/purepng.com-cyberpunk-2077-logologosgame-logogame-logosgameslogocyberpunk-2077-12715289961328hlgr.png"
            alt="Cyberpunk 2077">
    </div>

    <script>

        // Update clock and date

        function updateClock() {

            const now = new Date();

            // Time
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const formattedHours = hours % 12 || 12;
            const ampm = hours >= 12 ? 'PM' : 'AM';

            document.getElementById('time').textContent =
                `${String(formattedHours).padStart(2, '0')}:${minutes} ${ampm}`;

            // Date
            const dateOptions = {
                weekday: 'long',
                day: 'numeric',
                month: 'long'
            };

            document.getElementById('date').textContent =
                now.toLocaleDateString('en-IN', dateOptions);
        }

        // Initial update
        updateClock();

        // Update every second
        setInterval(updateClock, 1000);

    </script>

</body>
</html>
